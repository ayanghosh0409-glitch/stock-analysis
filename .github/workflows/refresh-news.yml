name: Refresh sector news

on:
  schedule:
    - cron: "17 2 * * *" # every day about 07:47 IST (02:17 UTC)
  workflow_dispatch: {}
  # On a pull request that touches the news job, run it as a dry run: fetch for real, publish the result as a
  # build artifact and a summary, but do not commit anything.
  pull_request:
    paths:
      - "scripts/refresh_news.py"
      - "scripts/test_refresh_news.py"
      - "data/news-queries.json"
      - "data/stock-aliases.json"
      - ".github/workflows/refresh-news.yml"

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Fetch headlines
        env:
          OUT: ${{ github.event_name == 'pull_request' && 'news-preview.json' || 'data/news.json' }}
        run: |
          python scripts/refresh_news.py --out "$OUT" | tee news-summary.md
          { echo "### Sector news fetch"; cat news-summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the dry-run result
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: news-preview
          path: news-preview.json
      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Refresh sector news $(date -u +%F)"
          git pull --rebase origin main
          git push
